# Generated by tungo-sdkgen. Do not edit.
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tungoai"
version = "0.3.0" # x-release-version
description = "Official Python library for the Tungo Platform API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Tungo" }]
keywords = ["tungo", "api", "sdk", "accounting", "kazakhstan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "anyio>=4.4,<5",
    "typing-extensions>=4.10,<5",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.13",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "trio>=0.27",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/TungoAI/tungo-sdk-python"
Repository = "https://github.com/TungoAI/tungo-sdk-python"
Issues = "https://github.com/TungoAI/tungo-sdk-python/issues"
Changelog = "https://github.com/TungoAI/tungo-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tungoai"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/conformance",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "examples"]
mypy_path = "src"
explicit_package_bases = true

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingModuleSource = "error"
# The SDK validates its arguments at run time for callers that do not use a type checker.
reportUnnecessaryIsInstance = false

# The tests reach into the private modules of the package they test.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

[[tool.pyright.executionEnvironments]]
root = "."

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # long lines are descriptions taken from the API contract
    "RUF001", # the contract's descriptions are in Russian
    "RUF002",
    "RUF003",
    "UP028",  # the synchronous code is derived from the asynchronous code, which cannot "yield from"
    "RUF036", # "X | None | Omit" reads in the order of meaning: value, null, absent
]

[tool.ruff.lint.per-file-ignores]
# The synchronous test files are derived from the asynchronous ones by the generator: their
# layout follows the source, so the layout rules are checked on the source only.
"tests/*_sync.py" = ["I001", "SIM117", "C416"]
# The part shown in the README comes first and is complete by itself; the code that feeds it a
# sample delivery follows with its own imports.
"examples/webhooks.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["tungoai"]

[tool.ruff.format]
exclude = ["tests/*_sync.py"]
