[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tungo-sdk"
version = "0.1.0"
description = "Official Python SDK for Tungo AI Platform API (1C AI Accountant, Automations, Webhooks)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["tungo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
