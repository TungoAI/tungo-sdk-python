name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync version from tag
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            sed -i "s/^version = .*/version = \"${VER}\"/" pyproject.toml
          fi

      - name: Run tests & build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine pytest
          pytest
          python -m build
          twine check dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}" || true

      - name: Publish to PyPI (API token or Trusted Publishing)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [[ -n "${TWINE_PASSWORD}" ]]; then
            twine upload --skip-existing dist/*
          else
            echo "PYPI_API_TOKEN not set; configure PyPI Trusted Publisher or secrets.PYPI_API_TOKEN to upload to PyPI."
          fi
