# Generated by tungo-sdkgen. Do not edit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Version consistency
        run: bash scripts/release-version.sh check "$(python -c 'import tungoai; print(tungoai.__version__)')"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy --strict, pyright strict)
        run: |
          mypy
          pyright
      - name: Test
        run: pytest -q

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel into a clean environment and run the examples' imports
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import tungoai; from tungoai import Tungo, AsyncTungo, TungoMoney; from tungoai.types import Company; print(tungoai.__version__, TungoMoney.to_tiyn('1.005'))"
          /tmp/clean/bin/python "${GITHUB_WORKSPACE}/examples/money.py"
